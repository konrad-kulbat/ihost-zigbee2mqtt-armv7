name: Test ARMv7 add-on runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-armv7:
    name: ARMv7 build and integration test
    runs-on: ubuntu-latest
    env:
      TEST_IMAGE: ihost-zigbee2mqtt-armv7:test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate add-on metadata
        run: |
          jq -e '(.arch | index("armv7")) and .uart == true and .udev == true and .hassio_api == true and .ingress == true and (.services | index("mqtt:need")) and (.image | contains("{arch}")) and .startup == "application"' zigbee2mqtt/config.json
      - name: Build linux/arm/v7 test image
        uses: docker/build-push-action@v6
        with:
          context: zigbee2mqtt
          platforms: linux/arm/v7
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run ARMv7 integration tests
        run: bash tests/test-ihost-armv7.sh "$TEST_IMAGE"
