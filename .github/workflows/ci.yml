name: Build and validate ARMv7 add-on

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ihost-zigbee2mqtt-armv7-armv7

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate add-on manifest and no unconfigured registry path
        run: |
          jq -e '.arch == ["armv7"] and .slug == "ihost-zigbee2mqtt-armv7" and .ingress == true and .uart == true and .udev == true' zigbee2mqtt/config.json
          ! grep -R --line-number 'YOUR_GITHUB_OWNER' zigbee2mqtt/config.json
      - name: Verify pinned Zigbee2MQTT release metadata
        run: |
          test "$(jq -r .version zigbee2mqtt/config.json | sed 's/-ihost\..*$//')" = "$(awk -F= '/^ZIGBEE2MQTT_VERSION=/{print $2}' zigbee2mqtt/build.env)"

  build-armv7:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and publish outside pull requests)
        uses: docker/build-push-action@v6
        with:
          context: zigbee2mqtt
          platforms: linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:2.14.1-ihost.2
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inspect published ARMv7 manifest
        if: github.event_name != 'pull_request'
        run: docker buildx imagetools inspect "${IMAGE_NAME}:2.14.1-ihost.2"
